<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jose · Humano Digital (beta)</title>
  <meta name="description" content="Humano digital 3D interactivo: personaje modelado en Blender, render Three.js, cara 2D procedural, lip-sync en español, mirada y emociones en tiempo real, conversación con IA.">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤓</text></svg>">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
    } }
  </script>
</head>
<body>
  <div class="paper" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <canvas id="gl" aria-label="Jose, humano digital 3D"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="loading" id="loading"><span class="spinner"></span> Cargando a Jose…</div>

    <header class="brand">
      <h1>Jose <span>· humano digital</span> <sup class="beta">BETA</sup></h1>
      <p class="tag">Blender → Three.js · cara 2D procedural · lip-sync · IA</p>
    </header>

    <div class="status" id="status" data-state="idle"><i></i><span>Listo</span></div>

    <div class="emotions" role="group" aria-label="Probar emociones">
      <button data-emo="neutral" title="Neutral">😐</button>
      <button data-emo="alegria" title="Alegría">😄</button>
      <button data-emo="sorpresa" title="Sorpresa">😮</button>
      <button data-emo="duda" title="Duda">🤨</button>
      <button data-emo="tristeza" title="Tristeza">😢</button>
      <button data-emo="pensativo" title="Pensativo">🤔</button>
    </div>
  </main>

  <aside class="chat" id="chat" aria-label="Conversación">
    <div class="chat-head">
      <div>
        <strong>Conversación</strong>
        <small id="modeLabel">Modo demo</small>
      </div>
      <button class="icon" id="settingsBtn" title="Ajustes" aria-label="Ajustes">⚙️</button>
    </div>
    <ol class="log" id="log" aria-live="polite"></ol>
    <div class="suggest" id="suggest">
      <button>Hola, ¿quién eres?</button>
      <button>Cuéntame de Arcade Station</button>
      <button>¿Cómo funciona tu boca?</button>
      <button>Cuéntame un chiste</button>
    </div>
    <form class="composer" id="composer">
      <button type="button" class="icon mic" id="micBtn" title="Hablar (reconocimiento de voz)" aria-label="Hablar">🎙️</button>
      <input id="input" autocomplete="off" placeholder="Escríbele a Jose…" aria-label="Mensaje">
      <button type="submit" class="send" aria-label="Enviar">➤</button>
    </form>
    <button class="mirror" id="mirrorBtn" type="button">🪞 Modo espejo: imita tu voz con el micrófono</button>
  </aside>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>Ajustes</h2>
      <label>Cerebro
        <select id="modeSel">
          <option value="demo">Demo (sin internet, sabe de los proyectos de Jose)</option>
          <option value="claude">Claude (conversación libre)</option>
        </select>
      </label>
      <label class="claude-only">API key de Anthropic
        <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off">
      </label>
      <label class="claude-only check"><input type="checkbox" id="rememberKey"> Recordar la key en este navegador</label>
      <p class="claude-only note">La key se usa solo desde tu navegador para hablar con la API de Claude. No la compartas en equipos ajenos.</p>
      <label>Voz <select id="voiceSel"></select></label>
      <label>Velocidad <input id="rate" type="range" min="0.7" max="1.4" step="0.05" value="1.05"></label>
      <label class="check"><input type="checkbox" id="voiceOn" checked> Hablar en voz alta</label>
      <menu><button value="ok" class="primary">Listo</button></menu>
    </form>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
