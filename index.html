<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOSE.EXE · chatea con mi humano digital (beta)</title>
  <meta name="description" content="Chatea con Jose Luis Pineda en pixel art: un humano digital que piensa, gesticula y responde con voz procedural de 8 bits.">
  <meta name="theme-color" content="#0d2a2e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/pixel/avatar.png">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
    } }
  </script>
</head>
<body class="pixel-mode">
  <main class="stage" id="stage">
    <canvas id="gl" aria-label="Jose, humano digital en pixel art"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="loading" id="loading"><span class="spinner"></span> CARGANDO JOSE…</div>
    <header class="hud">
      <div class="logo">JOSE<span>.EXE</span> <b class="beta">BETA</b></div>
    </header>
  </main>

  <aside class="chat" aria-label="Chat con Jose">
    <header class="chat-head">
      <img src="assets/pixel/avatar.png" width="40" height="40" alt="">
      <div>
        <strong>JOSE</strong>
        <small id="presence">en línea</small>
      </div>
      <nav class="chat-tools">
        <button type="button" class="tool" id="voiceBtn" aria-pressed="true" title="Sonido">SONIDO</button>
        <button type="button" class="tool" id="mirrorBtn" aria-pressed="false" title="Modo espejo: imita tu boca con el micrófono">ESPEJO</button>
        <button type="button" class="tool" id="settingsBtn" title="Ajustes">AJUSTES</button>
      </nav>
    </header>

    <ol class="log" id="log" aria-live="polite"></ol>

    <div class="starters" id="starters">
      <button type="button">¿Quién eres?</button>
      <button type="button">¿Qué estudias?</button>
      <button type="button">¿Cuáles son tus metas?</button>
    </div>

    <form class="composer" id="composer">
      <input id="input" autocomplete="off" spellcheck="false" maxlength="300" placeholder="Escribe tu pregunta…" aria-label="Pregunta para Jose">
      <button type="button" class="tool" id="micBtn" title="Preguntar con la voz">MIC</button>
      <button type="submit" class="tool send">ENVIAR</button>
    </form>
  </aside>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>AJUSTES</h2>
      <label>Cerebro
        <select id="modeSel">
          <option value="demo">Demo (sin internet, sabe de Jose)</option>
          <option value="claude">Claude (conversación libre)</option>
        </select>
      </label>
      <label class="claude-only">API key de Anthropic
        <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off">
      </label>
      <label class="claude-only check"><input type="checkbox" id="rememberKey"> Recordar la key en este navegador</label>
      <p class="claude-only note">La key se usa solo desde tu navegador para hablar con la API de Claude.</p>
      <label>Voz
        <select id="voiceMode">
          <option value="blips">Blips de 8 bits (procedural)</option>
          <option value="tts">Voz del navegador</option>
        </select>
      </label>
      <label class="tts-only">Voz del navegador <select id="voiceSel"></select></label>
      <label>Velocidad <input id="rate" type="range" min="0.7" max="1.4" step="0.05" value="1.05"></label>
      <label class="check"><input type="checkbox" id="voiceOn" checked> Sonido encendido</label>
      <menu><button value="ok" class="tool">OK</button></menu>
    </form>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
